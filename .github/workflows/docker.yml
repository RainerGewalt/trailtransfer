name: Docker

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # The same gate as on main. A tag whose commit fails it gets no image.
  quality:
    uses: ./.github/workflows/ci.yml

  image:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/trailtransfer
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # The index digest belongs in the release notes: a tag can be moved, a
      # digest cannot (docs/RELEASE.md).
      - name: Image digest
        run: |
          echo "ghcr.io/${{ github.repository_owner }}/trailtransfer@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
