# Demo broker config only: anonymous access on all interfaces. For anything
# beyond a local evaluation, require authentication and configure ACLs so only
# authorised senders can publish to */commands. The worker connects over plain
# TCP (no TLS), so keep the broker on the worker's host or a trusted network
# segment, or reach it through a tunnel (SECURITY.md, "Known limits").
listener 1883
allow_anonymous true
