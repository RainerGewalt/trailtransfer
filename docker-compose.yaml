# TrailTransfer one-command demo:
#   docker compose up --build
# then publish a command:
#   mosquitto_pub -h localhost -p 1883 \
#     -t trailtransfer/worker-01/commands -f examples/commands/check.json
# and watch the lifecycle:
#   mosquitto_sub -h localhost -p 1883 -v -t 'trailtransfer/worker-01/#'
services:
  trailtransfer:
    build:
      context: .
      args:
        VERSION: dev
    depends_on:
      evidence-init: { condition: service_completed_successfully }
      mqtt: { condition: service_started }
      s3: { condition: service_started }
    environment:
      TRAILTRANSFER_WORKER_ID: worker-01
      TRAILTRANSFER_MQTT_HOST: mqtt
      TRAILTRANSFER_MQTT_PORT: "1883"
      TRAILTRANSFER_POLICY_FILE: /config/worker-policy.example.yaml
      TRAILTRANSFER_RCLONE_CONFIG: /config/rclone.conf.example
      TRAILTRANSFER_EVIDENCE_JOURNAL: /data/evidence/journal.jsonl
      TRAILTRANSFER_LOG_LEVEL: info
    volumes:
      - ./config:/config:ro            # worker-policy + rclone.conf
      - ./upload_folder:/data/input:ro # sample source files
      - ./evidence:/data/evidence      # writable: append-only evidence journal
    restart: unless-stopped

  # Demo only. Docker creates ./evidence as root, but the worker runs as
  # nonroot and creates its journal with mode 0600, so it could neither write
  # it nor could you read it from the host. This one-shot step creates the
  # journal in advance and makes it writable for everyone; the worker then
  # appends to it, and you can verify and edit it from the host. Existing
  # records are kept. A real deployment mounts a directory owned by the
  # worker's user instead.
  evidence-init:
    image: rclone/rclone:1.68
    entrypoint: ["sh", "-c", "touch /data/evidence/journal.jsonl && chmod 0777 /data/evidence && chmod 0666 /data/evidence/journal.jsonl"]
    volumes:
      - ./evidence:/data/evidence

  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # S3 target for the demo: rclone's own S3 server, from the same pinned rclone
  # release the worker uses. Buckets are top-level directories under /data;
  # rclone creates the demo bucket on the first copy.
  s3:
    image: rclone/rclone:1.68
    command: ["serve", "s3", "/data", "--addr", ":9000", "--auth-key", "demo,demo-secret-12345"]
    ports: ["9000:9000"]
    volumes:
      - s3-data:/data

volumes:
  s3-data:
